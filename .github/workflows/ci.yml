name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: memorywall
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: memorywall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memorywall -d memorywall"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://memorywall:devpassword@localhost:5432/memorywall?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Apply migrations and seed data
        run: |
          go run ./cmd/migrate up
          psql "$DATABASE_URL" -f scripts/seed.sql
      - run: go test ./...
      - run: go build ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Type-check
        run: npx next typegen && npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  # Deploys the API to Fly.io after both jobs pass on main. The web app
  # deploys through Vercel's own GitHub integration. Skipped until the
  # FLY_API_TOKEN repository secret exists.
  deploy-api:
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-api
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    defaults:
      run:
        working-directory: ./api
    steps:
      # Always check out, since the steps below run inside api/.
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
      - name: Skip
        if: env.FLY_API_TOKEN == ''
        run: echo "FLY_API_TOKEN isn't set, so the API wasn't deployed."
