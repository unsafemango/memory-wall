services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: memorywall
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: memorywall
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memorywall -d memorywall"]
      interval: 2s
      timeout: 3s
      retries: 15

  minio:
    image: bitnamilegacy/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Created on startup if missing.
      MINIO_DEFAULT_BUCKETS: memory-wall
      # The browser uploads straight to MinIO with presigned URLs, so it has
      # to accept cross-origin requests from the web app.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data

  api:
    build: ./api
    env_file: ./api/.env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      # Server-side fetches run inside the Docker network.
      API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
