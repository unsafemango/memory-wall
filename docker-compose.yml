services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  api:
    # TODO: Add API configuration
    build: ./api
    ports:
      - "9000:9000"
      - "9001:9001"
    depends_on:
      - postgres
      - minio

  web:
    # TODO: Add web configuration
    build: ./web
    ports:
      - "3000:3000"
    depends_on:
      - api

  volumes:
    postgres_data:
    minio_data:
